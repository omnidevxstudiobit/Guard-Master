<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — Guard Master</title>
<meta name="description" content="Guard Master factory-direct perimeter security. Every product priced incl. VAT.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>

<div class="wrap">
  <nav class="nav"><div class="nav-in">
    <a class="logo" href="/">
      <span class="mk"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="6.9"/><path d="M15.6 9.4A4.4 4.4 0 1 0 16.4 12H12.7"/></svg></span>
      guard&nbsp;master
    </a>
    <div class="nav-links">
      <a href="/#shop">Shop</a>
      <a href="/products/">Catalogue</a>
      <a href="/#contact">Contact</a>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".45"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input type="search" placeholder="Search the range…" aria-label="Search products">
      <button class="icon-btn" style="width:36px;height:36px;background:var(--ink);color:#fff;border-color:transparent" aria-label="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      </button>
    </label>
    <a class="btn btn--quote" href="/estimate/">Get a quote</a>
    <div class="cart" id="cart" data-open="false">
      <button class="c-pay" type="button" aria-label="Checkout now">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.4" y="5" width="19.2" height="14" rx="3.2"/><path d="M2.4 9.6h19.2"/><path d="M6 14.6h3.2"/></svg>
      </button>
      <button class="c-main" type="button" id="cartMain" aria-label="View cart">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 3.6h2.1l2.6 11.3h10.4"/><path d="M6.2 6.7h14.3l-1.7 6.3H7.6"/><circle cx="9.1" cy="19" r="1.7"/><circle cx="17.4" cy="19" r="1.7"/></svg>
        <span class="lbl">View cart</span>
      </button>
      <button class="c-count" type="button" id="cartCount" aria-label="0 items in cart">0</button>
    </div>
  </div></nav>

  <main>
    <p class="crumbs" style="margin:18px 0 0;font-size:13px;color:var(--muted)">
      <a href="/products/" style="color:inherit">Catalogue</a>
      <span aria-hidden="true"> / </span><span id="crumb"></span>
    </p>

    <!-- ── the product ─────────────────────────────────────────── -->
    <section class="pdp" style="padding-top:26px">
      <div class="gal">
        <div class="gal-thumbs" id="thumbs" role="tablist" aria-label="Product images"></div>
        <div class="gal-main" id="stage">
          <img id="mainImg" src="" alt="">
          <span class="gal-count" id="galCount"></span>
        </div>
      </div>

      <div class="pdp-info">
        <h1 id="pTitle" style="margin:0;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.04em;line-height:1.05"></h1>
        <p id="pDesc" class="lead" style="margin-top:12px;font-size:15.5px"></p>
        <p class="pdp-price"><b id="pPrice"></b><span id="pSpec"></span></p>
        <p class="sku" id="pSku"></p>

        <!-- build it: the factory's real options as chips -->
        <div id="opts" class="pdp-opts"></div>

        <!-- the sum: chosen spec, live total, add to cart -->
        <div class="card glass pdp-sum">
          <div id="sumRows"></div>
          <div class="sum total"><span class="k">Total</span><span class="v" id="pTotal"></span></div>
          <p class="sum-note" id="pNote"></p>
          <div class="pdp-buy">
            <div class="qty" aria-label="Quantity">
              <button type="button" id="qMinus" aria-label="Fewer">−</button>
              <input id="qty" inputmode="numeric" value="1" aria-label="Quantity">
              <button type="button" id="qPlus" aria-label="More">+</button>
            </div>
            <button class="btn btn--go" id="add" type="button" style="flex:1;justify-content:center">Add to cart
              <span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </button>
          </div>
        </div>

        <div class="trust" style="margin-top:20px">
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Price incl. 15% VAT</span>
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Free collection from Benoni South</span>
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg><a href="/policies/" style="color:inherit">Warranty &amp; returns</a></span>
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="13" width="12" height="8"/><path d="M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/></svg><button id="printSpec" type="button" style="all:unset;cursor:pointer;text-decoration:underline">Print spec sheet</button></span>
        </div>
      </div>
    </section>

    <!-- ── completes the system ────────────────────────────────── -->
    <section id="pairsSec" style="padding-top:10px">
      <h2 style="margin:0 0 18px;font-size:clamp(20px,2.6vw,28px)">Completes the system</h2>
      <div class="recs" id="pairs"></div>
    </section>

    <section id="contact" style="padding-top:0">
      <footer class="foot glass">
        <div class="foot-b" style="margin-top:0;padding-top:0;border-top:0">
          <span>Guard Master · Wire Ventures — perimeter security manufacturer</span>
          <span><a href="tel:+27114378903">+27 11 437 8903</a> · Benoni South, Gauteng</span>
        </div>
      </footer>
    </section>
  </main>
</div>

<!-- mobile sticky buy bar — config summary + add, per the brief -->
<div class="m-bar" id="mBar" hidden>
  <span class="m-tot" id="mTotal"></span>
  <button class="btn btn--go" id="mAdd" type="button">Add to cart</button>
</div>

<script type="module" src="/src/js/item.js"></script>
</body>
</html>
