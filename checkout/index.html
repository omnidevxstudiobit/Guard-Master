<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — Guard Master</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/src/styles/app.css">
<style>
  .co{display:grid; grid-template-columns:1.15fr .85fr; gap:26px; align-items:start}
  @media(max-width:940px){.co{grid-template-columns:1fr}}
  .summary{position:sticky; top:96px; padding:26px}
  .summary h3{margin:0 0 4px; font-size:16px; font-weight:700; letter-spacing:-.025em}
  .summary .cnt{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
  .co-form{padding:30px}
  @media(max-width:560px){.co-form{padding:22px}}
</style>
</head>
<body>

<div class="wrap">
  <nav class="nav"><div class="nav-in">
    <a class="logo" href="/">
      <span class="mk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.6 6.2v5.4c0 4.6 3.1 8.4 7.4 9.4 4.3-1 7.4-4.8 7.4-9.4V6.2Z"/></svg></span>
      guard&nbsp;master
    </a>
    <div class="nav-links" style="flex:1">
      <a href="/products/">Catalogue</a>
      <a href="/cart/">Cart</a>
    </div>
    <div class="cart" id="cart" data-open="false">
      <button class="c-pay" type="button" aria-label="Checkout now">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.4" y="5" width="19.2" height="14" rx="3.2"/><path d="M2.4 9.6h19.2"/><path d="M6 14.6h3.2"/></svg>
      </button>
      <button class="c-main" type="button" id="cartMain" aria-label="View cart">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 3.6h2.1l2.6 11.3h10.4"/><path d="M6.2 6.7h14.3l-1.7 6.3H7.6"/><circle cx="9.1" cy="19" r="1.7"/><circle cx="17.4" cy="19" r="1.7"/></svg>
        <span class="lbl">View cart</span>
      </button>
      <button class="c-count" type="button" id="cartCount" aria-label="0 items in cart">0</button>
    </div>
  </div></nav>

  <main id="main">
    <h1 class="tagline h1" style="margin:12px 0 28px;max-width:16ch">
      <span class="ln"><i>Checkout.</i></span>
    </h1>

    <div class="co" id="co">
      <!-- ── form ─────────────────────────────────────────── -->
      <form class="card glass glass--lit co-form" id="form" novalidate>

        <div class="step">
          <div class="step-h"><span class="step-n">1</span><h3>Who the order is for</h3></div>
          <div class="field">
            <label for="name">Full name <span class="req">*</span></label>
            <input id="name" name="name" autocomplete="name" required>
            <span class="err" data-err="name"></span>
          </div>
          <div class="row2">
            <div class="field">
              <label for="email">Email <span class="req">*</span></label>
              <input id="email" name="email" type="email" autocomplete="email" required>
              <span class="err" data-err="email"></span>
            </div>
            <div class="field">
              <label for="phone">Mobile <span class="req">*</span></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+27 82 000 0000" required>
              <span class="err" data-err="phone"></span>
            </div>
          </div>
          <div class="field">
            <label for="company">Company <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
            <input id="company" name="company" autocomplete="organization">
          </div>
        </div>

        <div class="step">
          <div class="step-h"><span class="step-n">2</span><h3>How you want it</h3></div>
          <div class="pick" id="fulfil">
            <label>
              <input type="radio" name="fulfil" value="collect" checked>
              <span><span class="t">Collect from the factory</span>
                <span class="s">10 Burnley Street, Benoni South · Mon–Thu 07:30–16:30, Fri to 13:30</span></span>
              <span class="amt">Free</span>
            </label>
            <label>
              <input type="radio" name="fulfil" value="deliver">
              <span><span class="t">Nationwide delivery</span>
                <span class="s">3m panels ship as oversized freight — cost confirmed against your address before dispatch</span></span>
              <span class="amt" id="delAmt">Quoted</span>
            </label>
          </div>
        </div>

        <div class="step" id="addrStep" hidden>
          <div class="step-h"><span class="step-n">3</span><h3>Delivery address</h3></div>
          <div class="field">
            <label for="street">Street address <span class="req">*</span></label>
            <input id="street" name="street" autocomplete="address-line1">
            <span class="err" data-err="street"></span>
          </div>
          <div class="row2">
            <div class="field">
              <label for="suburb">Suburb</label>
              <input id="suburb" name="suburb" autocomplete="address-level3">
            </div>
            <div class="field">
              <label for="city">City / town <span class="req">*</span></label>
              <input id="city" name="city" autocomplete="address-level2">
              <span class="err" data-err="city"></span>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="province">Province <span class="req">*</span></label>
              <select id="province" name="province">
                <option value="">Choose…</option>
                <option>Gauteng</option><option>Western Cape</option><option>KwaZulu-Natal</option>
                <option>Eastern Cape</option><option>Free State</option><option>Limpopo</option>
                <option>Mpumalanga</option><option>North West</option><option>Northern Cape</option>
              </select>
              <span class="err" data-err="province"></span>
            </div>
            <div class="field">
              <label for="postal">Postal code <span class="req">*</span></label>
              <input id="postal" name="postal" inputmode="numeric" autocomplete="postal-code">
              <span class="err" data-err="postal"></span>
            </div>
          </div>
        </div>

        <div class="step">
          <div class="step-h"><span class="step-n" id="nSite">3</span><h3>About the site</h3></div>
          <div class="field">
            <label for="site">Application</label>
            <select id="site" name="site">
              <option>Residential / estate</option>
              <option>Commercial</option>
              <option>Industrial</option>
              <option>High security</option>
              <option>Not sure — please advise</option>
            </select>
          </div>
          <div class="field">
            <label for="notes">Anything we should know <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
            <textarea id="notes" name="notes" placeholder="Perimeter length, ground conditions, access for a truck…"></textarea>
          </div>
        </div>

        <button class="btn btn--go" type="submit" id="place" style="width:100%;justify-content:space-between;font-size:16px;padding:16px 8px 16px 24px">
          <span id="placeLabel">Place order</span>
          <span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
        </button>

        <div class="trust">
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.6 6.2v5.4c0 4.6 3.1 8.4 7.4 9.4 4.3-1 7.4-4.8 7.4-9.4V6.2Z"/></svg> Manufactured in Benoni</span>
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Prices incl. 15% VAT</span>
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> No payment taken online</span>
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> <a href="/policies/" style="color:inherit">Warranty &amp; returns</a></span>
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3A19.5 19.5 0 0 1 5.2 13 19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.8a16 16 0 0 0 6.3 6.3l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.6 2Z"/></svg> Questions? <a href="tel:+27114378903" style="color:inherit">+27 11 437 8903</a></span>
        </div>
      </form>

      <!-- ── summary ──────────────────────────────────────── -->
      <aside class="card glass summary">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
          <h3>Order summary</h3>
          <span class="cnt" id="sumCount">0 items</span>
        </div>
        <div id="sumLines" style="margin-top:12px"></div>
        <div id="sumTotals"></div>
        <a class="btn" href="/cart/" style="width:100%;justify-content:center;margin-top:12px;font-size:14px">Back to cart</a>
      </aside>
    </div>
  </main>
</div>

<script type="module" src="/src/js/checkout.js"></script>
</body>
</html>
